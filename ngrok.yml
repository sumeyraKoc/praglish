# ngrok config - "Sahneyi Seslendir" ozelligini ayni WiFi'da OLMAYAN
# (orn. farkli sehirdeki bir arkadas, ya da mobil veriyle telefon) bir
# kisiyle test edebilmek icin. LAN IP + HTTP yaklasimi mikrofon icin
# yetersiz kaliyor cunku tarayicilar navigator.mediaDevices.getUserMedia'yi
# sadece HTTPS (ya da tam olarak localhost) uzerinde acar - bkz. README
# "Farkli cihazdan test".
#
# Bu dosya docker-compose.yml'deki "ngrok" servisi tarafindan kullanilir -
# yani ngrok'u Windows'a AYRICA KURMANA GEREK YOK, sadece
# "docker compose up -d" yeterli. Bu yuzden asagidaki "addr" degerleri
# localhost degil, compose agindaki SERVIS ADLARI (game/api) - ngrok
# container'i o servislere kendi container'inin icinden, docker'in kendi
# DNS'iyle ulasiyor.
#
# Iki tunel ayni anda gerekiyor cunku oyun (game) ve API (api) tarayici
# acisindan FARKLI adresler olacak (game/index.html'deki ?api=... parametresi
# tam olarak bunun icin eklendi).
#
# Authtoken buraya YAZILMIYOR - docker-compose.yml "ngrok" servisi onu
# NGROK_AUTHTOKEN ortam degiskeninden okuyor, o da senin .env dosyandan
# geliyor (bkz. .env.example). Boylece token bu dosyada / repoda gorunmez.
#
# Kullanim: docker compose up -d, sonra tarayicidan http://localhost:4040
# ac - orada iki tane https://xxxx.ngrok-free.app adresi gorursun (biri
# game, biri api icin). NOT: ucretsiz ngrok hesabinda bu adresler HER
# "docker compose up" ile YENIDEN rastgele olusur - sabit bir adres
# istersen ngrok'un ucretli planina gecmen gerekir.
version: "3"
tunnels:
  game:
    proto: http
    addr: game:5173
  api:
    proto: http
    addr: api:8000
