<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Praglish - Oda Prototipi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f0c17; }
    body { display: grid; place-items: center; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; }
    .dialogue-panel {
      box-sizing: border-box;
      width: 760px;
      height: 230px;
      padding: 16px 18px;
      border: 2px solid #ffd166;
      border-radius: 10px;
      background: rgba(33, 24, 47, 0.98);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .dialogue-header, .dialogue-form { display: flex; align-items: center; gap: 10px; }
    .dialogue-header { justify-content: space-between; margin-bottom: 9px; }
    .dialogue-header strong { color: #ffd166; font: 16px "Arial Black", Arial, sans-serif; }
    .dialogue-header span { margin-left: 9px; color: #a99dbd; font-size: 12px; }
    .dialogue-close { border: 0; background: transparent; color: #a99dbd; cursor: pointer; }
    .dialogue-messages {
      height: 105px;
      padding-right: 6px;
      overflow-y: auto;
      scrollbar-color: #5d4c72 transparent;
    }
    .dialogue-system { margin: 26px 0 0; text-align: center; color: #a99dbd; }
    .dialogue-message { display: grid; grid-template-columns: 92px 1fr; gap: 10px; margin: 0 0 9px; }
    .dialogue-message strong { color: #ffd166; font-size: 12px; }
    .dialogue-message span { color: #fff; font-size: 15px; line-height: 1.3; }
    .dialogue-message.user strong { color: #78dce8; }
    .dialogue-message.feedback span { color: #ffd166; }
    .dialogue-message.reward span { color: #8ee89b; }
    .dialogue-message.error span { color: #ff8e8e; }
    .dialogue-status { height: 18px; color: #a99dbd; font-size: 12px; }
    .dialogue-form input {
      flex: 1;
      box-sizing: border-box;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #5d4c72;
      border-radius: 6px;
      outline: 0;
      background: #171020;
      color: #fff;
      font-size: 15px;
    }
    .dialogue-form input:focus { border-color: #ffd166; }
    .dialogue-form button {
      height: 38px;
      min-width: 82px;
      border: 0;
      border-radius: 6px;
      background: #ffd166;
      color: #21182f;
      font-weight: 800;
      cursor: pointer;
    }
    .dialogue-form button:disabled { cursor: wait; opacity: 0.65; }
    .dialogue-form button.dialogue-mic {
      min-width: 46px;
      background: #3a2f52;
      color: #fff2d9;
      font-size: 16px;
    }
    .dialogue-form button.dialogue-mic.recording { background: #e0555f; color: #fff; }
    /* Vocabulary ("name it") paneli, NPC diyalog panelinden (sari) ayrisin diye yesil vurgu kullanir. */
    .vocab-panel { border-color: #8fd3a5; }
    .vocab-panel .dialogue-header strong { color: #8fd3a5; }
    .vocab-panel .dialogue-form input:focus { border-color: #8fd3a5; }
    .vocab-panel .dialogue-form button { background: #8fd3a5; }
    .dialogue-message.already span { color: #9d8fd1; }

    /* "Sahneyi Seslendir" (DubScene) paneli - .dialogue-panel'i temel alir,
       oda/lobi/sahne-sonu icerigi daha uzun oldugu icin biraz daha uzun ve
       ic govdesi kaydirilabilir. */
    /* Video eklenince (bkz. .dub-video asagida) panel daha uzun tutuluyor ki
       video kartin bos alanini doldursun (kucuk bir video birakip altinda
       bos yer/scroll birakmak yerine) - dub-panel--levels zaten kendi
       height'ini ezip veriyor, bu degisiklik onu etkilemiyor. */
    .dub-panel { height: 640px; border-color: #78dce8; }
    .dub-panel .dialogue-header strong { color: #78dce8; }
    /* Karakterin agiz hareketlerini gostermek icin SESSIZ video (bkz.
       DubScene.ts setupVideoElement/playVideoRange) - video_url'i olmayan
       script'lerde JS tarafindan display:none yapilip gizlenir. Sabit
       (max- degil) yukseklik kullaniliyor ki panel buyudukce video da
       kartin gercek bos alanini kullansin, altinda bosluk/gereksiz scroll
       kalmasin. */
    .dub-video {
      display: block;
      width: 100%;
      height: 340px;
      object-fit: cover;
      border-radius: 10px;
      background: #0f0c17;
      margin-bottom: 10px;
      border: 1px solid #3a2f52;
    }
    .dub-body { max-height: 220px; overflow-y: auto; padding-right: 6px; scrollbar-color: #5d4c72 transparent; }
    .dub-col { display: flex; flex-direction: column; gap: 10px; }
    .dub-row { display: flex; align-items: center; gap: 10px; }
    .dub-input {
      box-sizing: border-box;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #5d4c72;
      border-radius: 6px;
      outline: 0;
      background: #171020;
      color: #fff;
      font-size: 15px;
    }
    .dub-input:focus { border-color: #78dce8; }
    .dub-btn {
      height: 38px;
      min-width: 82px;
      border: 0;
      border-radius: 6px;
      background: #78dce8;
      color: #0f0c17;
      font-weight: 800;
      cursor: pointer;
      padding: 0 14px;
    }
    .dub-btn:disabled { cursor: wait; opacity: 0.6; }
    .dub-btn.secondary { background: #3a2f52; color: #fff2d9; }
    .dub-char-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .dub-char-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #5d4c72;
      background: #171020;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .dub-char-btn:hover { border-color: #78dce8; }

    /* DubScene - Ekran 1: script secimi. "Ahsap masa" arka plani (bkz.
       game/public/assets/dub/ui/script-select-bg.jpg) uzerinde, her script
       icin bir "not kagidi yigini" karti (bkz. DubScene.ts NOTE_IMAGES) -
       kartin ustunde script basligi ve o script'in GERCEK karakter
       isimlerini tasiyan renkli dugmeler var (Player 1/2 degil - bkz.
       DubScene.ts renderLevelItemHtml). Kartin altinda, oyuncunun o
       script'te en son sectigi karaktere ait replik sayisi kadar
       user-ikonu var; tamamlanan repliklerin ikonu yesile doner, en altta
       o karakterin ortalama dogruluk yuzdesi yazar. Ilerleme hesabi
       TARAYICIDA (localStorage) tutulur - bkz. DubScene.ts. */
    /* Seviye haritasi paneli DIKEY OLARAK ESNEK (flex column) - govde
       (.dub-levels-body) kalan tum alani doldurur ve icindekini ORTALAR.
       ONEMLI: bu, video ekranlarindaki .dub-body'nin max-height/overflow
       kisitlamasindan (asagida) AYRI bir sinif (.dub-levels-body) - ikisi
       karistirilmasin, aksi halde seviye haritasi 220px'de kesilip
       gereksiz bir ic scroll gosterir (daha once yasanan hata buydu). */
    .dub-panel--levels {
      width: 940px;
      height: 660px;
      display: flex;
      flex-direction: column;
      border-color: #c9922f;
      background-color: #171020;
      background-image: url("/assets/dub/ui/script-select-bg.jpg");
      background-size: cover;
      background-position: center;
    }
    /* Bu ekranin basligi klasik .dialogue-header (kalin yazi + "x") degil -
       referans "SELECT A SCRIPT"/"BACK" ahsap afisleri gibi UC AYRI eleman:
       sol = ahsap "Back" dugmesi (data-action="exit" - mount() bunu genel
       olarak dinliyor), orta = dekoratif ahsap "Listen & Repeat" afisi, sag
       = uzerine gelince/dokununca aciklama balonu acan "?" ikonu. Ahsap
       gorunum gercek bir gorsele degil, katmanli gradient/border/golgeye
       dayaniyor (.dub-wood-btn / .dub-wood-banner ortak temel). */
    .dub-levels-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 14px 20px 6px;
    }
    /* NOT: burada BILEREK text-transform:uppercase YOK - sayfa lang="tr"
       oldugu icin CSS uppercase, "i" harfini Turkce kuralina gore noktali
       "İ"ye cevirip karakter isimlerini (Reggie, King Little, ...) bozuyordu.
       Buyuk harf donusumu artik DubScene.ts bannerText() ile JS tarafinda
       (locale-duyarsiz toUpperCase) yapiliyor - buraya gelen metin zaten
       BUYUK HARF. */
    .dub-wood-btn,
    .dub-wood-banner {
      box-sizing: border-box;
      border-radius: 7px;
      border: 3px solid #d9ad63;
      background: linear-gradient(180deg, #7c4c26 0%, #5c3619 55%, #47280f 100%);
      box-shadow:
        inset 0 0 0 2px #3a2210,
        inset 0 2px 4px rgba(255, 210, 140, 0.25),
        0 3px 0 rgba(0, 0, 0, 0.45);
      color: #ffd873;
      font: 900 14px "Arial Black", Arial, sans-serif;
      letter-spacing: 1px;
      text-shadow: 1px 1px 0 #2a1608, 0 0 8px rgba(0, 0, 0, 0.3);
    }
    .dub-wood-btn {
      padding: 9px 20px;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .dub-wood-btn:hover { transform: translateY(-2px); }
    .dub-wood-btn--back { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 13px; padding: 8px 18px; }
    .dub-wood-btn--back:hover { transform: translateY(-50%) translateY(-2px); }
    .dub-wood-banner { padding: 12px 34px; font-size: 17px; pointer-events: none; }
    .dub-help { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); }
    .dub-help-icon {
      width: 30px;
      height: 30px;
      padding: 0;
      border-radius: 50%;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dub-help-tooltip {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 230px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #d9ad63;
      background: rgba(20, 13, 6, 0.97);
      color: #f1e6d0;
      font: 400 12px Arial, sans-serif;
      line-height: 1.4;
      text-align: left;
      text-transform: none;
      letter-spacing: normal;
      text-shadow: none;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.55);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
      pointer-events: none;
      z-index: 3;
    }
    .dub-help-tooltip strong { display: block; margin-bottom: 4px; color: #ffd166; font-size: 13px; }
    .dub-help:hover .dub-help-tooltip,
    .dub-help.open .dub-help-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }
    .dub-levels-status { text-align: center; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85); }
    .dub-levels-body {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dub-levels {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 28px;
      padding: 12px 20px 20px;
      width: 100%;
    }
    /* Her script bir "not kagidi" karti - not1-4.png zaten kagit/golge
       cizimini iceriyor, bu yuzden kartin kendi arka plan/border'i yok.
       Gorselin GERCEK "kagit" alani, kartin tum kutusundan kucuk (kenarlarda
       arkadaki yigin sayfalarinin egik koseleri tasiyor) - bu yuzden ic
       bosluk (padding) buyukce tutuluyor ki metin/dugmeler her zaman on
       sayfanin duz, okunakli bolgesinde kalsin, kagidin kenarlarina
       tasmasin. background-size 100% 100% kullanmiyoruz - gorselin en/boy
       orani bozulmasin diye contain + no-repeat.
       filter: iki ayri drop-shadow ust uste - biri kagidin desk'e deydigi
       yerde SIKI/koyu bir "temas golgesi", digeri daha genis/yumusak bir
       "havada duruyor" golgesi; boylece not, arka plana duz yapistirilmis
       gibi degil, masanin UZERINDE duruyormus gibi gorunur. */
    .dub-note-card {
      position: relative;
      box-sizing: border-box;
      min-height: 230px;
      padding: 74px 56px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: center;
      filter:
        drop-shadow(0 3px 3px rgba(20, 12, 4, 0.55))
        drop-shadow(0 18px 20px rgba(20, 12, 4, 0.4));
    }
    /* Baslik SADECE film/dizi adi (bkz. api/routes/dub.py title alanlari -
       artik "- sahne aciklamasi" eki yok), bu yuzden kisa ve tek/iki satirda
       kaliyor. Stil, kullanicinin referans aldigi afisteki gibi kalin,
       BUYUK HARF, duz siyah/kahve bir "poster basligi" - hafif bir vurgu
       (emboss) disinda golge/efekt yok. BUYUK HARF donusumu BURADA CSS ile
       DEGIL, DubScene.ts icinde JS .toUpperCase() ile yapiliyor - sayfa
       lang="tr" oldugu icin CSS text-transform:uppercase "i" harfini
       noktali "İ" yapip basliklari bozuyordu (bkz. renderLevelItemHtml). */
    .dub-note-title {
      width: 100%;
      font: 900 22px "Arial Black", Arial, sans-serif;
      color: #1c130a;
      text-align: center;
      letter-spacing: 0.5px;
      line-height: 1.2;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .dub-note-chars { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
    .dub-char-pill {
      padding: 6px 14px;
      border-radius: 999px;
      border: 0;
      background: var(--pill-color, #78dce8);
      color: #1a1120;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.12s ease;
    }
    .dub-char-pill:hover { transform: translateY(-2px); }

    /* DubScene - Ekran 2a/2b ("sira sende" / "sira baskasinda"): kullanicinin
       verdigi eski TV + kontrol konsolu gorseli (bkz.
       game/public/assets/dub/ui/studio-bg.jpg) uzerine kurulu. Video, TV'nin
       SIYAH EKRANININ icine; "tekrar dinle / kaydet / devam et" ikonlari
       ekranin ALTINDAKI uc konsol dugmesinin (turuncu/yesil/gri) TAM
       UZERINE mutlak konumlandirilir. Butun yuzdeler orijinal
       2528x1686 gorsel uzerinde olculdu (bkz. proje notlari) -
       .dub-studio-stage'in aspect-ratio'su gorselle AYNI tutuldugu icin
       (asagida) bu yuzdeler panel hangi genislikte render edilirse edilsin
       DOGRU hizalanmaya devam eder. */
    /* NOT: ayri bir "header" satiri (BACK dugmesi + ahsap tabela + replik
       sayaci) KALDIRILDI - o satir dikey yer kaplayip ekrani (video/monitor
       gorseli) kucultuyordu. BACK artik konsolun sol ustundeki cizili
       dugmelerden birinin (yesil, ilk dugme) UZERINE metin olarak
       yerlestiriliyor (bkz. .dub-console-btn--back), replik sayaci ise
       monitorun DISINA, corner'a yapistirilmis kucuk bir kagit etiket
       gorunumunde (bkz. .dub-studio-tag). Karakter/sira bilgisi artik tek
       satirlik durum metninin (.dub-studio-status) icine gomulu - ayrica
       panel genisligi 800->860px yapilarak bosalan dikey alan ekrani
       buyutmek icin kullanildi (bkz. DubScene.ts renderYourTurn/renderOtherTurn). */
    .dub-panel--studio { width: 860px; height: auto; }
    .dub-studio-status { margin-bottom: 8px; }
    .dub-studio-caption {
      margin: 0 0 8px;
      text-align: center;
      font-style: italic;
      font-size: 14px;
      color: #d8cfeb;
    }
    .dub-studio-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 2528 / 1686;
      background-image: url("/assets/dub/ui/studio-bg.jpg");
      background-size: 100% 100%;
      background-position: center;
      border-radius: 8px;
      overflow: hidden;
    }
    .dub-studio-video {
      position: absolute;
      left: 11.91%;
      top: 7.65%;
      width: 69.1%;
      height: 65.01%;
      object-fit: cover;
      background: #000;
    }
    /* Konsol ikonlari: cizilmis dugmenin UZERINDE, TAM OTURACAK sekilde
       konumlandirilir - kendi arka plani YOK (dugmenin kendi rengi/dokusu
       zaten gorselde var), sadece ikon ustte durur. */
    .dub-console-btn {
      position: absolute;
      top: 92.82%;
      border: 0;
      background: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .dub-console-btn svg { width: 55%; height: 55%; fill: #fff8ec; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.7)); }
    .dub-console-btn:hover:not(:disabled) { transform: scale(1.08); }
    .dub-console-btn:active:not(:disabled) { transform: scale(0.92); }
    .dub-console-btn:disabled { cursor: default; filter: grayscale(0.75) brightness(0.55); }
    .dub-console-btn--replay { left: 58.94%; width: 9.89%; height: 5.34%; }
    .dub-console-btn--record { left: 70.02%; width: 8.7%; height: 5.34%; }
    .dub-console-btn--record.recording svg { fill: #ffb3b3; }
    .dub-console-btn--record.recording { animation: dub-console-pulse 1s ease-in-out infinite; }
    .dub-console-btn--continue { left: 80.7%; top: 92.82%; width: 3.76%; height: 4.75%; }
    @keyframes dub-console-pulse {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 90, 90, 0)); }
      50% { filter: drop-shadow(0 0 10px rgba(255, 90, 90, 0.85)); }
    }
    /* BACK: konsolun sol ustundeki ilk (yesil) cizili dugmenin TAM UZERINE
       oturan metin - SVG ikon degil, dugmenin uzerine "kazinmis" gibi
       koyu/kontrastli bir yazi (bkz. yukaridaki NOT). */
    .dub-console-btn--back {
      left: 8.61%;
      top: 91.67%;
      width: 10.56%;
      height: 5%;
      color: #17280f;
      font: 900 13px "Arial Black", Arial, sans-serif;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
    }
    /* Replik sayaci: monitorun DISINA (ahsap cerceve kosesine) yapisik
       kucuk, hafif donuk bir kagit etiket - "yirtik not kagidi" hissi icin
       duzensiz koseler + hafif golge. Konumu %'lik oldugu icin panel
       genisligi degisse bile monitorun kosesinde kalir. */
    .dub-studio-tag {
      position: absolute;
      top: 1.5%;
      right: 6%;
      transform: rotate(-7deg);
      background: linear-gradient(160deg, #f3e6c2 0%, #e6d3a0 100%);
      border: 1px solid #b89a5e;
      border-radius: 3px 9px 4px 8px;
      padding: 4px 11px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      color: #4a3418;
      font: 800 13px "Arial Black", Arial, sans-serif;
      letter-spacing: 0.3px;
      z-index: 2;
    }
    .dub-studio-feedback { margin-top: 10px; }
    .dub-studio-feedback .dub-turn-indicator { margin: 8px 0 0; }

    .dub-turn-indicator { text-align: center; font-size: 16px; margin: 14px 0; color: #fff; }
    .dub-word { margin-right: 5px; }
    .dub-word.correct { color: #8ee89b; }
    .dub-word.wrong { color: #ff8e8e; }
    .dub-summary-line { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #3a2f52; overflow: auto; }
    .dub-summary-line strong { color: #78dce8; }
    .dialogue-status.dub-status-error { color: #ff8e8e; }

    /* StudioScene icindeki (Phaser DOM elemani) giris butonu - artik
       oyunun disina tasan sabit bir kose butonu degil, RoomScene/LibraryScene
       'den "S" tusuyla girilen kendi sahnesinin ici. */

    /* Pixel-paper ilhamli ilerleme defteri. Phaser DOM container'iyle birlikte
       canvas olceginde hareket eder; normal odalarda DOM'a hic eklenmez. */
    .progress-dashboard {
      box-sizing: border-box;
      width: 1120px;
      height: 660px;
      padding: 18px 26px 24px;
      border: 5px solid #d8c98f;
      outline: 3px solid #302d38;
      background: #10182d;
      color: #26231f;
      font-family: "Courier New", monospace;
      image-rendering: pixelated;
    }
    .progress-header { display: flex; align-items: center; justify-content: space-between; height: 54px; color: #e4d69d; }
    .progress-header strong { display: block; font: 900 30px "Courier New", monospace; letter-spacing: 3px; }
    .progress-header span { font-size: 11px; letter-spacing: 3px; }
    .paper-close { border: 2px solid #d8c98f; background: #151d33; color: #e4d69d; padding: 8px 12px; font: 700 12px "Courier New", monospace; cursor: pointer; }
    .paper-tabs { display: flex; gap: 8px; margin: 4px 0 -2px 30px; position: relative; z-index: 2; }
    .paper-tabs button { border: 2px solid #554f43; border-bottom: 0; background: #aa9b70; color: #29261f; padding: 8px 18px; font: 900 12px "Courier New", monospace; cursor: pointer; }
    .paper-tabs button.active { background: #e0d39f; transform: translateY(2px); }
    .paper-book { position: relative; display: grid; grid-template-columns: 1fr 28px 1fr; height: 526px; filter: drop-shadow(0 14px 12px rgba(0,0,0,.38)); }

      align-items: stretch;

  <script>
    // Oyun "localhost:5173" DISINDA bir adresten aciliyorsa (orn. ayni
    // WiFi/LAN'daki baska bir cihazdan senin bilgisayarinin IP'siyle
    // "http://192.168.x.x:5173" seklinde acilmasi), PraglishApiClient.ts ve
    // DubApiClient.ts'deki varsayilan "http://localhost:8000" o cihaza
    // isaret etmez ve calismaz. Bu yuzden ayni host'u (IP/domain), API'nin
    // calistigi 8000 portuyla otomatik kullaniyoruz - localhost'ta hicbir
    // sey degismiyor, sadece LAN erisiminde devreye giriyor.
    if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
      window.PRAGLISH_API_BASE_URL = `http://${location.hostname}:8000`;
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
