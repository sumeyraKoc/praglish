<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Praglish - Oda Prototipi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f0c17; }
    body { display: grid; place-items: center; }
    #game { width: 100%; height: 100%; }
    canvas { image-rendering: pixelated; }
    .dialogue-panel {
      box-sizing: border-box;
      width: 760px;
      height: 230px;
      padding: 16px 18px;
      border: 2px solid #ffd166;
      border-radius: 10px;
      background: rgba(33, 24, 47, 0.98);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .dialogue-header, .dialogue-form { display: flex; align-items: center; gap: 10px; }
    .dialogue-header { justify-content: space-between; margin-bottom: 9px; }
    .dialogue-header strong { color: #ffd166; font: 16px "Arial Black", Arial, sans-serif; }
    .dialogue-header span { margin-left: 9px; color: #a99dbd; font-size: 12px; }
    .dialogue-close { border: 0; background: transparent; color: #a99dbd; cursor: pointer; }
    .dialogue-messages {
      height: 105px;
      padding-right: 6px;
      overflow-y: auto;
      scrollbar-color: #5d4c72 transparent;
    }
    .dialogue-system { margin: 26px 0 0; text-align: center; color: #a99dbd; }
    .dialogue-message { display: grid; grid-template-columns: 92px 1fr; gap: 10px; margin: 0 0 9px; }
    .dialogue-message strong { color: #ffd166; font-size: 12px; }
    .dialogue-message span { color: #fff; font-size: 15px; line-height: 1.3; }
    .dialogue-message.user strong { color: #78dce8; }
    .dialogue-message.feedback span { color: #ffd166; }
    .dialogue-message.reward span { color: #8ee89b; }
    .dialogue-message.error span { color: #ff8e8e; }
    .dialogue-status { height: 18px; color: #a99dbd; font-size: 12px; }
    .dialogue-form input {
      flex: 1;
      box-sizing: border-box;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #5d4c72;
      border-radius: 6px;
      outline: 0;
      background: #171020;
      color: #fff;
      font-size: 15px;
    }
    .dialogue-form input:focus { border-color: #ffd166; }
    .dialogue-form button {
      height: 38px;
      min-width: 82px;
      border: 0;
      border-radius: 6px;
      background: #ffd166;
      color: #21182f;
      font-weight: 800;
      cursor: pointer;
    }
    .dialogue-form button:disabled { cursor: wait; opacity: 0.65; }
    .dialogue-form button.dialogue-mic {
      min-width: 46px;
      background: #3a2f52;
      color: #fff2d9;
      font-size: 16px;
    }
    .dialogue-form button.dialogue-mic.recording { background: #e0555f; color: #fff; }
    /* Vocabulary ("name it") paneli, NPC diyalog panelinden (sari) ayrisin diye yesil vurgu kullanir. */
    .vocab-panel { border-color: #8fd3a5; }
    .vocab-panel .dialogue-header strong { color: #8fd3a5; }
    .vocab-panel .dialogue-form input:focus { border-color: #8fd3a5; }
    .vocab-panel .dialogue-form button { background: #8fd3a5; }
    .dialogue-message.already span { color: #9d8fd1; }

    /* "Sahneyi Seslendir" (DubScene) paneli - .dialogue-panel'i temel alir,
       oda/lobi/sahne-sonu icerigi daha uzun oldugu icin biraz daha uzun ve
       ic govdesi kaydirilabilir. */
    .dub-panel { height: 460px; border-color: #78dce8; }
    .dub-panel .dialogue-header strong { color: #78dce8; }
    .dub-body { max-height: 340px; overflow-y: auto; padding-right: 6px; scrollbar-color: #5d4c72 transparent; }
    .dub-col { display: flex; flex-direction: column; gap: 10px; }
    .dub-row { display: flex; align-items: center; gap: 10px; }
    .dub-input {
      box-sizing: border-box;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #5d4c72;
      border-radius: 6px;
      outline: 0;
      background: #171020;
      color: #fff;
      font-size: 15px;
    }
    .dub-input:focus { border-color: #78dce8; }
    .dub-btn {
      height: 38px;
      min-width: 82px;
      border: 0;
      border-radius: 6px;
      background: #78dce8;
      color: #0f0c17;
      font-weight: 800;
      cursor: pointer;
      padding: 0 14px;
    }
    .dub-btn:disabled { cursor: wait; opacity: 0.6; }
    .dub-btn.secondary { background: #3a2f52; color: #fff2d9; }
    .dub-char-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .dub-char-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #5d4c72;
      background: #171020;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .dub-char-btn:hover { border-color: #78dce8; }
    .dub-turn-indicator { text-align: center; font-size: 16px; margin: 14px 0; color: #fff; }
    .dub-word { margin-right: 5px; }
    .dub-word.correct { color: #8ee89b; }
    .dub-word.wrong { color: #ff8e8e; }
    .dub-summary-line { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #3a2f52; overflow: auto; }
    .dub-summary-line strong { color: #78dce8; }
    .dialogue-status.dub-status-error { color: #ff8e8e; }

    /* StudioScene icindeki (Phaser DOM elemani) giris butonu - artik
       oyunun disina tasan sabit bir kose butonu degil, RoomScene/LibraryScene
       'den "S" tusuyla girilen kendi sahnesinin ici. */

    /* Pixel-paper ilhamli ilerleme defteri. Phaser DOM container'iyle birlikte
       canvas olceginde hareket eder; normal odalarda DOM'a hic eklenmez. */
    .progress-dashboard {
      box-sizing: border-box;
      width: 1120px;
      height: 660px;
      padding: 18px 26px 24px;
      border: 5px solid #d8c98f;
      outline: 3px solid #302d38;
      background: #10182d;
      color: #26231f;
      font-family: "Courier New", monospace;
      image-rendering: pixelated;
    }
    .progress-header { display: flex; align-items: center; justify-content: space-between; height: 54px; color: #e4d69d; }
    .progress-header strong { display: block; font: 900 30px "Courier New", monospace; letter-spacing: 3px; }
    .progress-header span { font-size: 11px; letter-spacing: 3px; }
    .paper-close { border: 2px solid #d8c98f; background: #151d33; color: #e4d69d; padding: 8px 12px; font: 700 12px "Courier New", monospace; cursor: pointer; }
    .paper-tabs { display: flex; gap: 8px; margin: 4px 0 -2px 30px; position: relative; z-index: 2; }
    .paper-tabs button { border: 2px solid #554f43; border-bottom: 0; background: #aa9b70; color: #29261f; padding: 8px 18px; font: 900 12px "Courier New", monospace; cursor: pointer; }
    .paper-tabs button.active { background: #e0d39f; transform: translateY(2px); }
    .paper-book { position: relative; display: grid; grid-template-columns: 1fr 28px 1fr; height: 526px; filter: drop-shadow(0 14px 12px rgba(0,0,0,.38)); }
    .paper-page { box-sizing: border-box; min-width: 0; padding: 28px 34px; background-color: #ded09a; background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(73,65,49,.09) 28px); border: 3px solid #6c624c; overflow: hidden; }
    .paper-page.left { border-radius: 12px 2px 2px 12px; box-shadow: inset -12px 0 18px rgba(74,62,39,.16); }
    .paper-page.right { border-radius: 2px 12px 12px 2px; box-shadow: inset 12px 0 18px rgba(74,62,39,.16); }
    .book-spine { background: repeating-linear-gradient(0deg, #253551 0 8px, #b9ac7c 9px 12px); border-top: 3px solid #6c624c; border-bottom: 3px solid #6c624c; }
    .paper-page h1 { margin: 0 0 20px; padding-bottom: 9px; border-bottom: 3px double #665d49; text-align: center; font-size: 22px; letter-spacing: 2px; }
    .paper-page h2 { margin: 8px 0; text-align: center; font-size: 19px; }
    .paper-scroll { height: 420px; overflow-y: auto; scrollbar-color: #756a50 #c7b982; }
    .paper-empty { grid-column: 1 / -1; align-self: center; justify-self: center; color: #766d58; font: 700 15px "Courier New", monospace; text-align: center; padding: 30px; }
    .pixel-avatar { width: 82px; height: 82px; margin: 8px auto; display: grid; place-items: center; border: 4px double #554f43; background: #c2b47f; font-size: 45px; }
    .level-ribbon { width: max-content; margin: 10px auto 20px; padding: 6px 14px; background: #253551; color: #e0d39f; font-weight: 900; }
    .paper-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .paper-stat-grid div { display: flex; justify-content: space-between; padding: 12px; border: 2px solid #756a50; background: rgba(255,249,211,.22); }
    .paper-stat-grid span { font-size: 12px; font-weight: 800; }
    .paper-stat-grid strong { color: #873e3e; }
    .success-score { display: flex; align-items: baseline; justify-content: center; gap: 12px; margin-bottom: 12px; }
    .success-score strong { color: #456645; font-size: 38px; }
    .success-score span { font-weight: 900; }
    .week-chart { height: 125px; display: flex; align-items: end; justify-content: space-around; border-left: 2px solid #756a50; border-bottom: 2px solid #756a50; padding: 0 8px; }
    .week-column { width: 46px; text-align: center; }
    .week-bars { height: 94px; display: flex; align-items: end; justify-content: center; gap: 3px; }
    .week-bars i { display: block; width: 13px; min-height: 2px; border: 1px solid #4d493e; }
    .week-bars .correct { background: #66845e; }
    .week-bars .incorrect { background: #a85454; }
    .week-column small { font-size: 9px; }
    .location-list { list-style: none; margin: 22px 0 0; padding: 0; border-top: 2px solid #756a50; }
    .location-list li { display: flex; justify-content: space-between; padding: 9px 4px; border-bottom: 1px dashed #887c5e; text-transform: uppercase; }
    .muted { color: #766d58; }
    .grammar-grid { display: grid; gap: 10px; }
    .grammar-card { position: relative; display: grid; gap: 6px; padding: 10px; border: 2px solid #756a50; overflow: hidden; }
    .grammar-card b, .grammar-card span { position: relative; z-index: 1; }
    .grammar-card span { font-size: 12px; }
    .grammar-card i { position: absolute; left: 0; bottom: 0; height: 5px; background: #66845e; }
    .grammar-card.bad i { background: #a85454; }
    .grammar-card.unseen { opacity: .64; border-style: dashed; }
    .grammar-card.unseen i { background: transparent; }
    .paper-meter { display: grid; grid-template-columns: 95px 1fr 35px; align-items: center; gap: 10px; margin: 15px 0; }
    .paper-meter span { font-size: 12px; font-weight: 900; }
    .paper-meter > i { display: block; height: 16px; border: 2px solid #665d49; background: #b7aa7c; }
    .paper-meter > i b { display: block; height: 100%; background: #52768a; }
    .paper-meter.error > i b { background: #a85454; }
    .idiom-card { display: flex; gap: 12px; align-items: center; padding: 12px; margin-bottom: 10px; border: 2px solid #756a50; background: rgba(255,249,211,.18); }
    .idiom-card > span { display: grid; place-items: center; width: 34px; height: 34px; background: #a85454; color: #eadca5; }
    .idiom-card div { display: grid; gap: 4px; }
    .idiom-card small { color: #655e50; }

    .dub-launcher {
      height: 48px;
      padding: 0 24px;
      border: 2px solid #78dce8;
      border-radius: 8px;
      background: rgba(33, 24, 47, 0.92);
      color: #78dce8;
      font: 700 16px Arial, sans-serif;
      cursor: pointer;
    }
    .dub-launcher:hover { background: #78dce8; color: #0f0c17; }

    /* MenuScene - ana mod secim ekrani: kapali halde dikey "sirt" (spine)
       kartlar yan yana hafif bindirilmis durur (kitap sirtlari gibi), uzerine
       gelince hafifce kalkar/egilir, tiklaninca yatayda genisleyip tam
       gorseli + aciklamayi + "Oyna" butonunu gosterir; digerleri kucularak
       kenara cekilir. Login/signup akisi henuz olmadigi icin oyun su an
       dogrudan bu menuden basliyor. */
    .menu-root {
      box-sizing: border-box;
      width: 1080px;
      height: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      font-family: Arial, sans-serif;
    }
    .menu-heading { text-align: center; }
    .menu-heading strong {
      display: block;
      color: #ffd166;
      font: 800 26px "Arial Black", Arial, sans-serif;
      letter-spacing: 2px;
    }
    .menu-heading span { color: #a99dbd; font-size: 14px; }
    .menu-accordion {
      display: flex;
      align-items: stretch;
      width: 100%;
      height: 380px;
      overflow: hidden;
    }
    .menu-card {
      position: relative;
      flex: 0 0 108px;
      margin-right: -18px;
      border-radius: 14px;
      border: 2px solid var(--accent, #78dce8);
      background: rgba(33, 24, 47, 0.96);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      overflow: hidden;
      transition: flex-basis 0.38s ease, transform 0.25s ease, margin 0.38s ease, opacity 0.3s ease;
      transform: translateY(0) rotate(0deg);
    }
    .menu-card:last-child { margin-right: 0; }
    .menu-card:not(.expanded):hover {
      transform: translateY(-16px) rotate(-2deg);
      z-index: 5;
    }
    .menu-card.expanded {
      flex: 1 1 auto;
      margin-right: 0;
      cursor: default;
      z-index: 10;
    }
    .menu-card.dimmed { opacity: 0.55; }
    .menu-card-spine {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    .menu-card.expanded .menu-card-spine { opacity: 0; pointer-events: none; }
    .menu-card-spine-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: var(--accent, #78dce8);
      font: 800 18px "Arial Black", Arial, sans-serif;
      letter-spacing: 3px;
      white-space: nowrap;
    }
    .menu-card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: stretch;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease 0.1s;
    }
    .menu-card.expanded .menu-card-face { opacity: 1; pointer-events: auto; }
    .menu-card-art {
      flex: 0 0 46%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.06), transparent 70%);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .menu-art-roleplay {
      background-image:
        linear-gradient(180deg, rgba(15, 12, 23, 0.15), rgba(15, 12, 23, 0.75)),
        url("/assets/library/wallBooks_E.png"),
        url("/assets/bakery/Bread_Display_Counter.png");
      background-position: center, left 8% top 6%, right 10% bottom 8%;
      background-size: cover, 46% auto, 42% auto;
      background-repeat: no-repeat;
    }
    .menu-mic-icon { filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4)); }
    .menu-card-info {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 28px 30px;
      color: #fff;
    }
    .menu-card-info h3 {
      margin: 0;
      color: var(--accent, #78dce8);
      font: 800 24px "Arial Black", Arial, sans-serif;
    }
    .menu-card-info p { margin: 0; color: #d8cfeb; font-size: 15px; line-height: 1.45; }
    .menu-play-btn {
      align-self: flex-start;
      height: 44px;
      padding: 0 26px;
      border: 0;
      border-radius: 8px;
      background: var(--accent, #78dce8);
      color: #171020;
      font: 800 16px Arial, sans-serif;
      cursor: pointer;
    }
    .menu-play-btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // Oyun "localhost:5173" DISINDA bir adresten aciliyorsa (orn. ayni
    // WiFi/LAN'daki baska bir cihazdan senin bilgisayarinin IP'siyle
    // "http://192.168.x.x:5173" seklinde acilmasi), PraglishApiClient.ts ve
    // DubApiClient.ts'deki varsayilan "http://localhost:8000" o cihaza
    // isaret etmez ve calismaz. Bu yuzden ayni host'u (IP/domain), API'nin
    // calistigi 8000 portuyla otomatik kullaniyoruz - localhost'ta hicbir
    // sey degismiyor, sadece LAN erisiminde devreye giriyor.
    if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
      window.PRAGLISH_API_BASE_URL = `http://${location.hostname}:8000`;
    }
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
